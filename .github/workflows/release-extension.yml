name: CmdPal Extension - Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.0.2.0)'
        required: true
        type: string
      release_notes:
        description: 'What is new in this version'
        required: false
        default: 'New release with latest updates and improvements.'
        type: string

env:
  DISPLAY_NAME: PortKill
  EXTENSION_NAME: PortKill
  FOLDER_NAME: PortKill
  GITHUB_REPO_URL: https://github.com/jasontiw/PowerToysCommandPalettePortKill
  PACKAGE_ID: JasonTiw.PortKill
  CLSID: f1172d0c-c4f4-4a1a-9560-e949e8993e17
  PACKAGE_FAMILY_NAME: PortKill_15b1mzc2p8w76

jobs:
  build-and-release:
    runs-on: windows-2022

    permissions:
      contents: write
      actions: read
      pull-requests: write

    steps:
    # -------------------------
    # 1. Checkout
    # -------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # -------------------------
    # 2. Setup .NET
    # -------------------------
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    # -------------------------
    # 3. CLEAN (CRITICAL FIX)
    # -------------------------
    - name: Clean previous builds
      shell: pwsh
      run: |
        # Clean AppPackages directory
        Remove-Item -Recurse -Force "${{ env.FOLDER_NAME }}/${{ env.EXTENSION_NAME }}/AppPackages" -ErrorAction SilentlyContinue
        # Clean any leftover MSIX/bundle files in root
        Remove-Item -Force "${{ env.FOLDER_NAME }}/${{ env.EXTENSION_NAME }}/*.msix*" -ErrorAction SilentlyContinue
        # Clean backup files from build-msix.ps1
        Remove-Item -Force "${{ env.FOLDER_NAME }}/${{ env.EXTENSION_NAME }}/*.manifest.backup" -ErrorAction SilentlyContinue
        # Clean bundle mapping
        Remove-Item -Force "${{ env.FOLDER_NAME }}/${{ env.EXTENSION_NAME }}/bundle_mapping.txt" -ErrorAction SilentlyContinue
        # Also clean any _Test directories that might have old versions
        Get-ChildItem -Path "${{ env.FOLDER_NAME }}/${{ env.EXTENSION_NAME }}" -Directory -Filter "*_Test" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

    # -------------------------
    # 4. BUILD MSIX
    # -------------------------
    - name: Build MSIX packages
      shell: pwsh
      run: |
        Set-Location "${{ env.FOLDER_NAME }}/${{ env.EXTENSION_NAME }}"
        .\build-msix.ps1 -Version "${{ github.event.inputs.version }}" -Platforms "x64","arm64"

    # -------------------------
    # 5. CREATE BUNDLE (optional)
    # -------------------------
    - name: Create MSIX bundle
      shell: pwsh
      run: |
        Set-Location "${{ env.FOLDER_NAME }}/${{ env.EXTENSION_NAME }}"

        $version = "${{ github.event.inputs.version }}"

        $x64 = Get-ChildItem "AppPackages\x64" -Recurse -Filter "*_x64*.msix" | Select-Object -First 1
        $arm = Get-ChildItem "AppPackages\arm64" -Recurse -Filter "*_arm64*.msix" -ErrorAction SilentlyContinue | Select-Object -First 1

        $mapping = "[Files]`n"
        $mapping += "`"$($x64.FullName)`" `"$($x64.Name)`"`n"

        if ($arm) {
          $mapping += "`"$($arm.FullName)`" `"$($arm.Name)`"`n"
        }

        $mapping | Out-File "bundle_mapping.txt" -Encoding UTF8

        $makeappx = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" -Recurse |
          Sort-Object Name -Descending |
          Select-Object -First 1

        if ($makeappx) {
          & $makeappx.FullName bundle /f bundle_mapping.txt /p "${{ env.EXTENSION_NAME }}_$version.msixbundle"
        }

    # -------------------------
    # 6. CREATE GITHUB RELEASE (FIXED)
    # -------------------------
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: "${{ env.DISPLAY_NAME }} v${{ github.event.inputs.version }}"
        body: |
          ## ${{ env.DISPLAY_NAME }} v${{ github.event.inputs.version }}

          ## What's New
          ${{ github.event.inputs.release_notes }}

          ## Installation
          - x64: *_x64.msix
          - ARM64: *_arm64.msix

        files: |
          ${{ env.FOLDER_NAME }}/${{ env.EXTENSION_NAME }}/AppPackages/**/*.msix
          ${{ env.FOLDER_NAME }}/${{ env.EXTENSION_NAME }}/*.msixbundle
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}

    # -------------------------
    # 7. WINGET UPDATE
    # -------------------------
    - name: Install wingetcreate
      shell: pwsh
      run: |
        iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

    - name: Update WinGet manifest
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      run: |
        $version = "${{ github.event.inputs.version }}"
        $tag = "v$version"

        $x64 = Get-ChildItem "${{ env.FOLDER_NAME }}/${{ env.EXTENSION_NAME }}/AppPackages/x64" -Recurse -Filter "*_x64*.msix" | Select-Object -First 1
        $arm = Get-ChildItem "${{ env.FOLDER_NAME }}/${{ env.EXTENSION_NAME }}/AppPackages/arm64" -Recurse -Filter "*_arm64*.msix" -ErrorAction SilentlyContinue | Select-Object -First 1

        $base = "${{ env.GITHUB_REPO_URL }}/releases/download/$tag"

        $args = @()
        $args += "$base/$($x64.Name)|x64"

        if ($arm) {
          $args += "$base/$($arm.Name)|arm64"
        }

        .\wingetcreate.exe update "${{ env.PACKAGE_ID }}" `
          --version $version `
          --urls $args `
          --token "${{ secrets.GH_PAT }}" `
          --submit
